<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Telegram TCG</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK oficial do Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Ecrã Inicial / Menu Principal -->
        <div id="main-menu" class="screen">
            <h1>Card Battle TCG</h1>
            <div id="user-info">
                <p>Jogador: <span id="username">Carregando...</span></p>
                <p>Rank: <span id="user-rank">Novato</span> | Vitórias: <span id="user-wins">0</span></p>
            </div>
            <div class="menu-buttons">
                <button onclick="startGameMode('bot')">Batalhar contra Bot</button>
                <button onclick="startGameMode('multiplayer')">Modo Multiplayer (Grupo)</button>
                <button onclick="openDeckBuilder()">Meu Baralho / Cartas</button>
            </div>
        </div>

        <!-- Ecrã de Batalha (Oculto inicialmente) -->
        <div id="battle-screen" class="screen hidden">
            <div class="opponent-field">
                <h3>Oponente (HP: <span id="opp-hp">8000</span>)</h3>
                <div id="opponent-field" class="card-container"></div>
            </div>
            
            <div class="battle-info">
                <p id="game-status">Sua vez de jogar!</p>
            </div>

            <div class="player-field">
                <h3>Seu Campo</h3>
                <div id="field-container" class="card-container"></div>
                <h3>Sua Mão</h3>
                <div id="player-hand" class="card-container"></div>
            </div>
            <button onclick="endTurn()">Encerrar Turno</button>
            <button onclick="returnToMenu()">Sair para o Menu</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
