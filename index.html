<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gerador de Senha - Depósito Hentai</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #09090b;
            color: #f4f4f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            width: min(400px, calc(100% - 30px));
            padding: 25px;
            border: 1px solid #27272a;
            border-radius: 18px;
            background: #111113;
            text-align: center;
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 22px; }
        p { color: #a1a1aa; font-size: 14px; margin-bottom: 20px; }
        .token-display {
            background: #18181b;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #3f3f46;
            margin-bottom: 20px;
        }
        #senha-gerada {
            font-size: 22px;
            color: #38bdf8;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #38bdf8;
            color: #09090b;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        .btn:hover { background: #0ea5e9; }
        .status { margin-top: 15px; font-size: 13px; color: #10b981; }
    </style>
</head>
<body>

<div class="box">
    <h1>Senha de Verificação</h1>
    <p id="instrucoes">Copie a senha abaixo e cole-a na página de verificação do seu servidor para liberar o download.</p>

    <div class="token-display">
        <span style="font-size: 12px; color: #a1a1aa; display: block; margin-bottom: 5px;">Senha gerada:</span>
        <span id="senha-gerada">A validar...</span>
    </div>

    <button id="btn-copiar" class="btn" onclick="copiarSenha()" style="display:none;">Copiar Senha</button>
    <div id="status-msg" class="status"></div>
</div>

<script>
    function gerarSenhaAleatoria() {
        const chars = "0123456789ABCDEF";
        let seq = "";
        for (let i = 0; i < 4; i++) {
            seq += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return "HENTAI-" + seq;
    }

    // Captura os parâmetros 'pack' e 'token' fornecidos pelo servidor
    const urlParams = new URLSearchParams(window.location.search);
    const packNome = urlParams.get("pack") || "padrao";
    const token = urlParams.get("token") || "";

    const senhaFinal = gerarSenhaAleatoria();

    // URL do seu túnel Cloudflare ativo
    const servidorUrl = "https://resistance-fares-resources-modules.trycloudflare.com/api/gerar-senha";

    function enviarParaServidor() {
        if (!token) {
            document.getElementById("senha-gerada").innerText = "Acesso Negado";
            document.getElementById("instrucoes").innerText = "Você precisa aceder a esta página através do encurtador oficial!";
            document.getElementById("status-msg").style.color = "#ef4444";
            document.getElementById("status-msg").innerText = "Token em falta ou inválido.";
            return;
        }

        fetch(servidorUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
            },
            body: `pack=${encodeURIComponent(packNome)}&senha=${encodeURIComponent(senhaFinal)}&token=${encodeURIComponent(token)}`
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "sucesso") {
                document.getElementById("senha-gerada").innerText = senhaFinal;
                document.getElementById("btn-copiar").style.display = "block";
                document.getElementById("status-msg").style.color = "#10b981";
                document.getElementById("status-msg").innerText = "Senha sincronizada com sucesso!";
                
                // Limpa o token da barra de endereços para impedir que o utilizador copie o link seguro
                window.history.replaceState({}, document.title, window.location.pathname + "?pack=" + encodeURIComponent(packNome));
            } else {
                document.getElementById("senha-gerada").innerText = "Erro";
                document.getElementById("instrucoes").innerText = data.mensagem || "O token já foi utilizado ou expirou.";
                document.getElementById("status-msg").style.color = "#ef4444";
                document.getElementById("status-msg").innerText = "Acesso bloqueado.";
            }
        })
        .catch(err => {
            console.log("Erro de conexão:", err);
            document.getElementById("status-msg").style.color = "#ef4444";
            document.getElementById("status-msg").innerText = "Erro ao comunicar com o servidor Python.";
        });
    }

    enviarParaServidor();

    function copiarSenha() {
        navigator.clipboard.writeText(senhaFinal).then(() => {
            const msg = document.getElementById("status-msg");
            msg.innerText = "Senha copiada para a área de transferência!";
            setTimeout(() => { msg.innerText = ""; }, 3000);
        });
    }
</script>

</body>
</html>
