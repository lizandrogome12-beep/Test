<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini Jogo no Telegram</title>
    <!-- Script oficial do Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        button {
            background-color: #38bdf8;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active {
            background-color: #0284c7;
        }
    </style>
</head>
<body>
    <h1>🎮 Meu Jogo de Cliques</h1>
    <p>Pontuação: <span id="pontos">0</span></p>
    
    <button onclick="clicar()">Clique aqui!</button>

    <script>
        // Inicializa o Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand();

        let placar = 0;

        function clicar() {
            placar++;
            document.getElementById('pontos').innerText = placar;
            
            // Faz o celular vibrar levemente a cada clique
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
