<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerador de Senha - Depósito Hentai</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #09090b;
            color: #f4f4f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            width: min(400px, calc(100% - 30px));
            padding: 25px;
            border: 1px solid #27272a;
            border-radius: 18px;
            background: #111113;
            text-align: center;
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 22px; }
        p { color: #a1a1aa; font-size: 14px; margin-bottom: 20px; }
        .token-display {
            background: #18181b;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #3f3f46;
            margin-bottom: 20px;
        }
        #senha-gerada {
            font-size: 22px;
            color: #38bdf8;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #38bdf8;
            color: #09090b;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        .btn:hover { background: #0ea5e9; }
        .status { margin-top: 15px; font-size: 13px; color: #10b981; }
    </style>
</head>
<body>

<div class="box">
    <h1>Senha de Verificação</h1>
    <p>Copie a senha abaixo e cole-a na página de verificação do seu servidor para liberar o download.</p>

    <div class="token-display">
        <span style="font-size: 12px; color: #a1a1aa; display: block; margin-bottom: 5px;">Senha gerada:</span>
        <span id="senha-gerada">Gerando...</span>
    </div>

    <button class="btn" onclick="copiarSenha()">Copiar Senha</button>
    <div id="status-msg" class="status"></div>
</div>

<script>
    // Função para gerar uma senha aleatória idêntica ao padrão do servidor
    function gerarSenhaAleatoria() {
        const chars = "0123456789ABCDEF";
        let seq = "";
        for (let i = 0; i < 4; i++) {
            seq += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return "HENTAI-" + seq;
    }

    // Lê o parâmetro 'pack' da URL (ex: seutipo.github.io/?pack=NomeDoPack)
    const urlParams = new URLSearchParams(window.location.search);
    const packNome = urlParams.get("pack") || "padrao";

    // Gera a senha localmente
    const senhaFinal = gerarSenhaAleatoria();
    document.getElementById("senha-gerada").innerText = senhaFinal;

    // Função para registrar a senha no seu servidor Python (caso o túnel esteja acessível publicamente)
    // Se o seu servidor estiver rodando localmente via Termux/Ngrok, altere a URL abaixo para o seu link do túnel.
    const servidorUrl = "https://SEU_TUNEL_AQUI.ngrok-free.app/api/gerar-senha";

    function enviarParaServidor() {
        if (!servidorUrl.includes("SEU_TUNEL_AQUI")) {
            fetch(servidorUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: `pack=${encodeURIComponent(packNome)}&senha=${encodeURIComponent(senhaFinal)}`
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "sucesso") {
                    document.getElementById("status-msg").innerText = "Senha sincronizada com sucesso!";
                }
            })
            .catch(err => console.log("Aviso ao sincronizar:", err));
        }
    }

    enviarParaServidor();

    function copiarSenha() {
        navigator.clipboard.writeText(senhaFinal).then(() => {
            const msg = document.getElementById("status-msg");
            msg.innerText = "Senha copiada para a área de transferência!";
            setTimeout(() => { msg.innerText = ""; }, 3000);
        });
    }
</script>

</body>
</html>
